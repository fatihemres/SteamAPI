name: SteamAPI CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Display .NET environment info
        run: dotnet --info

      - name: Restore dependencies
        run: dotnet restore SteamAPI.sln

      - name: Build (Debug)
        run: dotnet build SteamAPI.sln --configuration Debug --no-restore

      - name: Run tests (Debug)
        run: dotnet test SteamAPI.sln --configuration Debug --no-build --no-restore

      - name: Build (Release)
        run: dotnet build SteamAPI.sln --configuration Release --no-restore

      - name: Run tests (Release)
        run: dotnet test SteamAPI.sln --configuration Release --no-build --no-restore

      - name: Validate Desktop Packaging (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          ./desktop/package-release.ps1
          if (-not (Test-Path "artifacts/releases/SteamAPI-Desktop-Setup-v0.1.0-win-x64.exe")) {
            throw "Expected installer artifacts/releases/SteamAPI-Desktop-Setup-v0.1.0-win-x64.exe was not found."
          }
          if (-not (Test-Path "artifacts/releases/SteamAPI-Desktop-Setup-v0.1.0-win-x64.exe.sha256")) {
            throw "Expected checksum file artifacts/releases/SteamAPI-Desktop-Setup-v0.1.0-win-x64.exe.sha256 was not found."
          }
          if (-not (Test-Path "artifacts/releases/SteamAPI-Desktop-v0.1.0-win-x64.zip")) {
            throw "Expected release archive artifacts/releases/SteamAPI-Desktop-v0.1.0-win-x64.zip was not found."
          }
          if (-not (Test-Path "artifacts/releases/SteamAPI-Desktop-v0.1.0-win-x64.zip.sha256")) {
            throw "Expected checksum file artifacts/releases/SteamAPI-Desktop-v0.1.0-win-x64.zip.sha256 was not found."
          }

      - name: Upload Windows Desktop Artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: steamapi-desktop-v0.1.0-win-x64
          path: |
            artifacts/releases/SteamAPI-Desktop-Setup-v0.1.0-win-x64.exe
            artifacts/releases/SteamAPI-Desktop-Setup-v0.1.0-win-x64.exe.sha256
            artifacts/releases/SteamAPI-Desktop-v0.1.0-win-x64.zip
            artifacts/releases/SteamAPI-Desktop-v0.1.0-win-x64.zip.sha256
          if-no-files-found: error

  publish-desktop-v0_1_0:
    name: Publish SteamAPI Desktop v0.1.0
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      startsWith(github.event.head_commit.message, 'release(desktop): SteamAPI Desktop v0.1.0 (#4)')
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified Windows installation packages
        uses: actions/download-artifact@v4
        with:
          name: steamapi-desktop-v0.1.0-win-x64
          path: release-assets

      - name: Validate checksums before publication
        shell: bash
        run: |
          cd release-assets
          for file in SteamAPI-Desktop-Setup-v0.1.0-win-x64.exe SteamAPI-Desktop-v0.1.0-win-x64.zip; do
            test -s "$file"
            test -s "$file.sha256"
            expected=$(head -c 64 "$file.sha256" | tr '[:upper:]' '[:lower:]')
            actual=$(sha256sum "$file" | cut -d ' ' -f 1)
            if [ "$expected" != "$actual" ]; then echo "Checksum mismatch: $file" >&2; exit 1; fi
          done

      - name: Create verified GitHub Release (draft then publish)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --tags https://github.com/${{ github.repository }}.git refs/tags/steamapi-desktop-v0.1.0 | grep -q .; then
            echo 'Release tag already exists; refusing to overwrite it.' >&2
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          # SteamAPI Desktop v0.1.0

          First Windows x64 desktop release. The installer is the recommended download.

          **Recommended:** `SteamAPI-Desktop-Setup-v0.1.0-win-x64.exe` — standard Windows per-user installation with shortcuts and uninstaller.

          **Alternative:** `SteamAPI-Desktop-v0.1.0-win-x64.zip` — portable version without installation.

          Includes game search using the existing six-field SteamAPI backend contract, API Inspector, local companion API management, Settings, offline Demo Mode and About. The v0.2.0 backend API remains unchanged.

          The installer is unsigned; Windows SmartScreen may show an Unknown Publisher warning. Compatible with Windows x64 and includes the .NET 10 runtime.
          EOF
          gh release create steamapi-desktop-v0.1.0 \
            release-assets/SteamAPI-Desktop-Setup-v0.1.0-win-x64.exe \
            release-assets/SteamAPI-Desktop-Setup-v0.1.0-win-x64.exe.sha256 \
            release-assets/SteamAPI-Desktop-v0.1.0-win-x64.zip \
            release-assets/SteamAPI-Desktop-v0.1.0-win-x64.zip.sha256 \
            --draft --latest=false --target "$GITHUB_SHA" \
            --title 'SteamAPI Desktop v0.1.0' --notes-file release-notes.md
          count=$(gh release view steamapi-desktop-v0.1.0 --json assets --jq '.assets | length')
          if [ "$count" -ne 4 ]; then echo "Expected 4 release assets, found $count" >&2; exit 1; fi
          gh release edit steamapi-desktop-v0.1.0 --draft=false
